<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Данные из Google Sheets</title>
  <style>
    :root { color-scheme: dark; --bg:#10131b; --panel:#191f2b; --line:#30394a; --text:#edf1f7; --muted:#9ca8ba; --accent:#77a9ff; --danger:#ff7b7b; }
    * { box-sizing: border-box; }
    body { margin:0; padding:28px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    main { max-width:1200px; margin:0 auto; }
    h1 { margin:0 0 6px; font-size:24px; }
    .sub,.meta { color:var(--muted); }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:22px 0 14px; }
    input { flex:1 1 260px; min-width:180px; padding:11px 13px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); font:inherit; }
    button { padding:11px 16px; border:0; border-radius:9px; background:var(--accent); color:#0c1422; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .status { padding:13px 15px; border:1px solid var(--line); border-radius:10px; background:var(--panel); margin-bottom:14px; overflow-wrap:anywhere; }
    .status.error { border-color:#784747; color:#ffd1d1; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
    table { width:100%; border-collapse:collapse; min-width:560px; }
    th,td { padding:11px 13px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:pre-wrap; overflow-wrap:anywhere; }
    th { position:sticky; top:0; background:#222b3a; font-weight:700; }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:#202938; }
    .empty { padding:28px; color:var(--muted); text-align:center; }
    .meta { margin-top:12px; font-size:13px; }
    @media (max-width:650px) { body { padding:16px; } h1 { font-size:21px; } }
  </style>
</head>
<body>
<main>
  <h1>Данные из Google Sheets</h1>
  <div class="sub">Источник: опубликованная таблица Google Sheets · лист gid=0</div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Поиск по таблице…" aria-label="Поиск по таблице" disabled>
    <button id="refresh" type="button">Обновить данные</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">Подключаюсь к Google Sheets…</div>
  <div id="table" class="table-wrap"><div class="empty">Ожидание данных</div></div>
  <div id="meta" class="meta">Автообновление: при открытии страницы и в 00:00 по московскому времени, пока страница открыта.</div>
</main>
<script>
  const PUBLISHED_ID = '2PACX-1vQ8xul8qKJkY41l8e_W1ZSdErazAd3cwW_u-ZNRXQcGGQnu5GPYM9oz2w4EvPeyKcdISGOIx5xf6OUs';
  const GID = '0';
  const MOSCOW_TZ = 'Europe/Moscow';

  const statusEl = document.getElementById('status');
  const tableEl = document.getElementById('table');
  const metaEl = document.getElementById('meta');
  const searchEl = document.getElementById('search');
  const refreshBtn = document.getElementById('refresh');
  let allRows = [];
  let lastMoscowDate = moscowDateKey();
  let isLoading = false;

  function moscowDateKey() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: MOSCOW_TZ, year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    const get = type => parts.find(p => p.type === type)?.value || '';
    return `${get('year')}-${get('month')}-${get('day')}`;
  }

  function csvToRows(csv) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < csv.length; i++) {
      const ch = csv[i];
      if (quoted) {
        if (ch === '"' && csv[i + 1] === '"') { field += '"'; i++; }
        else if (ch === '"') quoted = false;
        else field += ch;
      } else {
        if (ch === '"') quoted = true;
        else if (ch === ',') { row.push(field); field = ''; }
        else if (ch === '\n') { row.push(field.replace(/\r$/, '')); rows.push(row); row = []; field = ''; }
        else field += ch;
      }
    }
    if (field.length || row.length) { row.push(field.replace(/\r$/, '')); rows.push(row); }
    if (rows.length && rows[0][0]) rows[0][0] = rows[0][0].replace(/^\uFEFF/, '');
    return rows.filter(r => r.some(cell => String(cell).trim() !== ''));
  }

  function isProbablyHtml(text) {
    return /^\s*<!doctype html/i.test(text) || /^\s*<html/i.test(text) ||
      /accounts\.google\.com|request access|запросить доступ/i.test(text.slice(0, 1500));
  }

  async function fetchCsv() {
    const stamp = Date.now();
    const urls = [
      `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?gid=${GID}&single=true&output=csv&_=${stamp}`,
      `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?output=csv&gid=${GID}&_=${stamp}`
    ];
    const errors = [];
    for (const url of urls) {
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const body = await response.text();
        if (isProbablyHtml(body)) throw new Error('Google вернул HTML вместо CSV');
        const rows = csvToRows(body);
        if (!rows.length) throw new Error('CSV пустой');
        return { rows, method: 'CSV' };
      } catch (e) {
        errors.push(e.message || String(e));
      }
    }
    // JSONP fallback: avoids browser CORS restrictions on cross-origin fetch.
    try {
      const rows = await fetchViaGvizJsonp(stamp);
      if (rows.length) return { rows, method: 'Google Visualization (JSONP)' };
      errors.push('Google Visualization вернул пустую таблицу');
    } catch (e) {
      errors.push(e.message || String(e));
    }
    throw new Error(errors.join(' · '));
  }

  function fetchViaGvizJsonp(stamp) {
    return new Promise((resolve, reject) => {
      const callbackHost = window.google || (window.google = {});
      callbackHost.visualization = callbackHost.visualization || {};
      callbackHost.visualization.Query = callbackHost.visualization.Query || {};
      const previous = callbackHost.visualization.Query.setResponse;
      let finished = false;
      const script = document.createElement('script');
      const timer = setTimeout(() => finish(new Error('Истекло время ожидания ответа Google (15 секунд)')), 15000);

      function finish(error, rows) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        script.remove();
        if (previous) callbackHost.visualization.Query.setResponse = previous;
        else delete callbackHost.visualization.Query.setResponse;
        if (error) reject(error); else resolve(rows);
      }

      callbackHost.visualization.Query.setResponse = response => {
        if (!response || response.status === 'error' || !response.table) {
          const reason = response?.errors?.map(x => x.detailed_message || x.message).join('; ');
          finish(new Error(reason || 'Google Visualization не вернул таблицу'));
          return;
        }
        const cols = response.table.cols || [];
        const dataRows = response.table.rows || [];
        const headers = cols.map((c, i) => c.label || c.id || `Столбец ${i + 1}`);
        const rows = [headers, ...dataRows.map(r => cols.map((_, i) => {
          const cell = r.c?.[i];
          return cell ? (cell.f ?? cell.v ?? '') : '';
        }))];
        finish(null, rows.filter(r => r.some(v => String(v ?? '').trim() !== '')));
      };

      script.onerror = () => finish(new Error('Не удалось загрузить ответ Google Visualization'));
      script.src = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/gviz/tq?tqx=out:json&gid=${GID}&_=${stamp}`;
      document.head.appendChild(script);
    });
  }

  function renderTable() {
    const query = searchEl.value.trim().toLocaleLowerCase('ru');
    const headers = allRows[0] || [];
    const data = allRows.slice(1).filter(row => !query ||
      row.some(cell => String(cell ?? '').toLocaleLowerCase('ru').includes(query)));
    if (!headers.length) {
      tableEl.innerHTML = '<div class="empty">Таблица не содержит строк.</div>';
      return;
    }
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headers.forEach(value => {
      const th = document.createElement('th'); th.textContent = value ?? ''; headRow.appendChild(th);
    });
    thead.appendChild(headRow); table.appendChild(thead);
    const tbody = document.createElement('tbody');
    data.forEach(row => {
      const tr = document.createElement('tr');
      headers.forEach((_, index) => {
        const td = document.createElement('td'); td.textContent = row[index] ?? ''; tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableEl.replaceChildren(table);
    if (!data.length) tableEl.innerHTML = '<div class="empty">В таблице нет строк с такими данными.</div>';
  }

  async function loadData(reason = 'обновление') {
    if (isLoading) return;
    isLoading = true;
    refreshBtn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.textContent = 'Загружаю данные из Google Sheets…';
    try {
      const result = await fetchCsv();
      allRows = result.rows;
      searchEl.disabled = false;
      renderTable();
      const time = new Intl.DateTimeFormat('ru-RU', {
        timeZone: MOSCOW_TZ, dateStyle: 'short', timeStyle: 'medium'
      }).format(new Date());
      statusEl.textContent = `Данные загружены · ${Math.max(0, allRows.length - 1)} строк · ${time} (Москва). Способ: ${result.method}.`;
      metaEl.textContent = `Последнее обновление: ${time}. Автообновление при открытии и в 00:00 по Москве.`;
    } catch (err) {
      statusEl.classList.add('error');
      statusEl.textContent = `Не удалось загрузить данные. Подробности: ${err.message}. Проверьте, что таблица опубликована для просмотра и опубликован именно лист с gid=${GID}.`;
      if (!allRows.length) tableEl.innerHTML = '<div class="empty">Нет данных. Подробности ошибки указаны выше.</div>';
    } finally {
      isLoading = false;
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', () => loadData('ручная кнопка'));
  searchEl.addEventListener('input', renderTable);

  setInterval(() => {
    const today = moscowDateKey();
    if (today !== lastMoscowDate) {
      lastMoscowDate = today;
      loadData('автоматическое обновление в 00:00 по Москве');
    }
  }, 15000);

  loadData('открытие страницы');
</script>
</body>
</html>
